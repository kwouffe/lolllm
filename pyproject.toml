[project]
name = "lolllm"
version = "0.1.0"
description = "Living Off The Land: Large Language Models — community detection repository"
requires-python = ">=3.12"
dependencies = [
    "mkdocs-material>=9.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "yamllint>=1.35",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
