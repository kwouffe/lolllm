title: Claude Code API Connection from Node.js
id: d4e5f6a7-b8c9-0123-defa-234567890123
status: experimental
description: Detects outbound HTTPS connections to api.anthropic.com originating from
  node.exe or node, indicating Claude Code CLI activity on the endpoint.
author: lolllm-project
date: 2025/01/01
tags:
  - attack.exfiltration
  - attack.t1048.002
  - attack.execution
  - attack.t1059
references:
  - https://github.com/Emilien/lolllm
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Image|endswith:
      - '\node.exe'
    DestinationHostname|endswith:
      - 'api.anthropic.com'
      - 'statsig.anthropic.com'
  condition: selection
falsepositives:
  - Any other Node.js application calling the Anthropic API
  - Authorized developer use of Claude Code
level: medium
