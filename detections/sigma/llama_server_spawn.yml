title: Ollama llama.cpp Inference Subprocess Spawned
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: Detects the creation of ollama_llama_server.exe as a child of ollama.exe.
  This subprocess is spawned for each active inference session and loads model weights
  into GPU/CPU memory. Its presence confirms active LLM inference on the endpoint.
author: lolllm-project
date: 2025/01/01
tags:
  - attack.execution
  - attack.t1059
references:
  - https://github.com/emilien/lolllm
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\ollama.exe'
    Image|endswith: '\ollama_llama_server.exe'
  condition: selection
falsepositives:
  - Authorized use of Ollama by ML/research teams
level: medium
