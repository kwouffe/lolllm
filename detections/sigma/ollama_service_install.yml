title: Ollama Service Installation
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: Detects the installation of the Ollama service on Windows via Event ID 7045.
  Ollama registers a background service to persist the inference API across reboots.
author: lolllm-project
date: 2025/01/01
tags:
  - attack.persistence
  - attack.t1543.003
references:
  - https://github.com/emilien/lolllm
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
    ServiceName|contains: 'Ollama'
  condition: selection
falsepositives:
  - Authorized Ollama deployment by IT/ML teams
level: high
