title: Claude Code Credentials File Access
id: e5f6a7b8-c9d0-1234-efab-345678901234
status: experimental
description: Detects file read access to ~/.claude/credentials.json, which stores
  long-lived Anthropic API tokens. Access by unexpected processes may indicate
  credential theft targeting LLM API keys.
author: lolllm-project
date: 2025/01/01
tags:
  - attack.credential_access
  - attack.t1552.001
references:
  - https://github.com/Emilien/lolllm
logsource:
  category: file_access
  product: windows
detection:
  selection:
    FileName|contains: '\.claude\credentials.json'
  filter_legit:
    Image|endswith:
      - '\node.exe'
      - '\Code.exe'
  condition: selection and not filter_legit
falsepositives:
  - Backup agents reading user profile directories
  - Authorized security tooling
level: high
