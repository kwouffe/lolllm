stages:
  - validate
  - build
  - deploy

default:
  image: python:3.12-slim

.install: &install
  before_script:
    - pip install --quiet -e ".[dev]"

validate:
  stage: validate
  <<: *install
  script:
    - yamllint -c .yamllint yaml/
    - python scripts/validate.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  <<: *install
  script:
    - python scripts/generate_docs.py
    - python scripts/generate_feeds.py
    - mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - echo "Publishing to Forgejo Pages"
  artifacts:
    paths:
      - site/
  publish: site/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [build]
