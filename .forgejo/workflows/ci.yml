name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Lint YAML
        run: yamllint -c .yamllint yaml/

      - name: Validate schema
        run: python scripts/validate.py

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Generate docs
        run: python scripts/generate_docs.py

      - name: Generate feeds
        run: python scripts/generate_feeds.py

      - name: Build site
        run: mkdocs build --strict

      - name: Deploy to Codeberg Pages
        run: |
          mkdir -p /tmp/deploy
          cp -r site/. /tmp/deploy/
          cd /tmp/deploy
          git init -b pages
          git config user.email "ci@lolllm"
          git config user.name "lolllm-ci"
          git remote add deploy "https://x-token-auth:${GITHUB_TOKEN}@codeberg.org/Emilien/lolllm.git"
          git add .
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force deploy pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
