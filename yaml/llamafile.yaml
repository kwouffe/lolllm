Name: Llamafile
Category: InferenceEngine
Description: |
  Llamafile is Mozilla's single-file executable format that bundles a GGUF model
  and the llama.cpp inference engine into one self-contained binary. A llamafile
  can be downloaded and executed from any writable directory with no installation,
  no dependencies, and no package manager. It automatically opens a browser-based
  chat UI and serves an OpenAI-compatible API on port 8080. The absence of a
  standard install path and the single-file nature make it a high-fidelity
  Living-Off-The-Land binary — detection must rely on YARA (combined
  GGUF+binary magic), process behaviour, and network indicators.
Author: '@lolllm-project'
Created: '2025-01-01'
LastModified: '2025-01-01'
ReviewStatus: unreviewed

Details:
  Website: https://github.com/Mozilla-Ocho/llamafile
  License: Apache-2.0
  Privileges: user
  Free: true
  SupportedOS:
    - Windows
    - Linux
    - macOS
  Capabilities:
    - LocalInference
    - APIServer
    - GPUAcceleration

Artifacts:

  Disk:
    - Path: '*.llamafile'
      Description: >
        Self-contained executable containing both the llama.cpp engine and a GGUF
        model. No standard install path — runs from any directory. May be renamed
        to hide its nature.
      OS: Any
      Type: Binary

  ModelStorage:
    - Path: '*.llamafile'
      Description: The llamafile itself contains an embedded GGUF model at a fixed internal offset
      OS: Any
      MagicBytes:
        - Format: GGUF
          Hex: '47 47 55 46'
          Offset: 0

  Process:
    - Name: llamafile
      Description: >
        May appear under any name since the file can be renamed. On Linux/macOS
        the process name reflects the filename. On Windows, any .exe with GGUF
        magic bytes at offset 0 is suspect.
      CLI:
        - Pattern: '.*\.llamafile.*--server'
          Description: Explicit server mode
        - Pattern: '.*\.llamafile.*--host\s+0\.0\.0\.0'
          Description: API exposed beyond localhost
        - Pattern: '.*\.llamafile.*-p\s+'
          Description: Non-interactive single-prompt execution
      ParentProcess: bash

  Network:
    - Description: Built-in OpenAI-compatible API server and chat UI
      Protocol: TCP
      Ports:
        - 8080
      BindAddress: '127.0.0.1'
      Domains: []

  Persistence:
    - OS: Linux
      Type: Service
      Path: /etc/systemd/system/llamafile.service
      Description: User-created systemd unit to run llamafile as a persistent service

  EventLog:
    - EventID: 4688
      ProviderName: Microsoft-Security-Auditing
      LogFile: Security.evtx
      Description: Process creation for any executable with GGUF magic bytes — use YARA-on-execution

  Registry: []

Detections:
  Sigma:
    - Path: detections/sigma/llamafile_server_expose.yml
      Description: Detects llamafile bound to 0.0.0.0 (API exposed beyond localhost)
  YARA:
    - Path: detections/yara/gguf_magic_bytes.yar
      Description: Matches the embedded GGUF header inside the llamafile executable

References:
  - https://github.com/Mozilla-Ocho/llamafile
  - https://hacks.mozilla.org/2023/11/introducing-llamafile/

Acknowledgements:
  - Person: lolllm contributors
    Handle: ''
