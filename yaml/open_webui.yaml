Name: Open WebUI
Category: InferenceEngine
Description: |
  Open WebUI (formerly Ollama WebUI) is a self-hosted web interface for Ollama
  and OpenAI-compatible inference backends. It is typically deployed via Docker
  or pip and listens on port 3000. Open WebUI stores conversations, user
  accounts, and API keys in a local SQLite database. Its presence indicates
  a multi-user or persistent LLM inference setup on the endpoint or local server.
  It can be configured with external API keys (OpenAI, Anthropic), making it
  both a local inference frontend and a cloud API proxy.
Author: '@lolllm-project'
Created: '2025-01-01'
LastModified: '2025-01-01'
ReviewStatus: unreviewed

Details:
  Website: https://openwebui.com
  License: MIT
  Privileges: user
  Free: true
  SupportedOS:
    - Windows
    - Linux
    - macOS
  Capabilities:
    - LocalInference
    - APIServer
    - RemoteAPIProxy

Artifacts:

  Disk:
    - Path: ~/.local/share/open-webui/
      Description: Open WebUI data directory including SQLite database with conversations and API keys (Linux)
      OS: Linux
      Type: Config
      Phase: Activation
    - Path: ~/.local/share/open-webui/webui.db
      Description: SQLite database containing user accounts, conversation history, and stored API keys
      OS: Linux
      Type: Log
      Phase: Use
    - Path: '*/open-webui/backend/'
      Description: Open WebUI Python backend source (if installed from source)
      OS: Any
      Type: Binary
      Phase: Install

  ModelStorage: []

  Process:
    - Name: python
      Description: Open WebUI Python backend server (uvicorn)
      Phase: Use
      CLI:
        - Pattern: 'uvicorn.*open_webui'
          Description: Open WebUI backend server via uvicorn
          Phase: Use
        - Pattern: 'python.*open_webui'
          Description: Direct Python invocation of Open WebUI
          Phase: Use
      ParentProcess: bash

  Network:
    - Description: Open WebUI web interface
      Protocol: TCP
      Ports:
        - 3000
        - 8080
      BindAddress: '0.0.0.0'
      Domains: []
      Phase: Use
    - Description: Backend connection to Ollama
      Protocol: TCP
      Ports:
        - 11434
      BindAddress: ''
      Domains: []
      Phase: Use

  Persistence:
    - OS: Linux
      Type: Service
      Path: /etc/systemd/system/open-webui.service
      Description: Systemd unit for persistent Open WebUI deployment
      Phase: Activation

  EventLog:
    - EventID: 4688
      ProviderName: Microsoft-Security-Auditing
      LogFile: Security.evtx
      Description: Process creation for python.exe running uvicorn with open-webui
      Phase: Use

  Registry: []

Detections:
  Sigma:
    - Path: detections/sigma/open_webui_process.yml
      Description: Detects uvicorn or Python process running Open WebUI
      Phase: Use
    - Path: detections/sigma/open_webui_port.yml
      Description: Detects Open WebUI network listener on port 3000
      Phase: Use

References:
  - https://openwebui.com
  - https://github.com/open-webui/open-webui

Acknowledgements:
  - Person: lolllm contributors
    Handle: ''
