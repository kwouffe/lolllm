            filename based on the `sso_start_url`.
        - Type: url
          Ref: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.md
          Excerpt: >-
            The authentication token is cached to disk under the `~/.aws/sso/cache` directory with a
