              Excerpt: >-
                server := filepath.Join(dir, "ollama_llama_server") if runtime.GOOS == "windows" { server += ".exe"
                }
      ParentProcess: ollama
      Trust: source-cited
      Evidence:
        - Type: source
          Ref: https://raw.githubusercontent.com/ollama/ollama/v0.3.12/llm/server.go
          Excerpt: server := filepath.Join(dir, "ollama_llama_server") if runtime.GOOS == "windows" { server += ".exe" }
        - Type: source
