  Process:
    - Name: ollama
      Description: Main server and CLI process
      Phase: Use
      CLI:
        - Pattern: 'ollama\s+serve'
          Description: Starts the OpenAI-compatible REST API server on :11434
          Phase: Activation
          Trust: source-cited
          Evidence:
            - Type: url
              Ref: https://docs.ollama.com/cli.md
              Excerpt: >-
                ### Start Ollama ``` ollama serve ``` To view a list of environment variables that can be set run
                `ollama serve --help`
            - Type: url
              Ref: https://docs.ollama.com/faq.md
              Excerpt: >-
                Ollama binds 127.0.0.1 port 11434 by default. Change the bind address with the `OLLAMA_HOST`
                environment variable.
            - Type: url
              Ref: https://docs.ollama.com/linux.md
              Excerpt: '[Service] ExecStart=/usr/bin/ollama serve User=ollama Group=ollama Restart=always'
        - Pattern: 'ollama\s+run\s+\S+'
          Description: Pulls (if absent) and runs a named model interactively
          Phase: Use
          Trust: source-cited
          Evidence:
            - Type: url
              Ref: https://docs.ollama.com/cli.md
              Excerpt: '### Run a model ``` ollama run gemma4 ```'
            - Type: url
              Ref: https://docs.ollama.com/cli.md
              Excerpt: '``` ollama launch claude --model qwen3.5 ```'
            - Type: url
              Ref: https://docs.ollama.com/faq.md
              Excerpt: >-
                To preload a model using the CLI, use the command: ```shell theme={"system"} ollama run llama3.2 ""
                ```
        - Pattern: 'ollama\s+pull\s+\S+'
          Description: Downloads model weights from registry.ollama.ai
          Phase: Install
          Trust: source-cited
          Evidence:
            - Type: url
              Ref: https://docs.ollama.com/cli.md
              Excerpt: '### Download a model ``` ollama pull gemma4 ```'
            - Type: url
              Ref: https://docs.ollama.com/faq.md
              Excerpt: >-
                Ollama pulls models from the Internet and may require a proxy server to access the models. Use
                `HTTPS_PROXY` to redirect outbound requests through the proxy.
            - Type: url
              Ref: https://docs.ollama.com/api/pull.md
              Excerpt: >-
                PullRequest: type: object required: - model properties: model: type: string description: Name of the
                model to download
      ParentProcess: systemd
      Trust: ai-generated
    - Name: ollama_llama_server
      Description: llama.cpp inference subprocess — spawned per-session by ollama
      Phase: Use
      CLI:
        - Pattern: 'ollama_llama_server.*--model\s+\S+\.gguf'
          Description: Inference subprocess loading a specific GGUF model file
          Phase: Use
          Trust: source-cited
