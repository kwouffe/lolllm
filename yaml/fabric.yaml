Name: Fabric
Category: CloudAPIClient
Description: |
  Fabric is an open-source CLI framework that pipes text through curated LLM
  prompts ("patterns") for tasks like summarisation, analysis, and content
  extraction. It is designed for seamless UNIX pipeline integration —
  `cat sensitive_file.txt | fabric --pattern summarize` trivially exfiltrates
  document content to a cloud LLM. Fabric stores API keys in
  ~/.config/fabric/.env and downloads patterns from GitHub. Its UNIX-native
  design makes it easy to embed in scripts and cron jobs, and its small
  footprint makes it easy to overlook.
Author: '@lolllm-project'
Created: '2025-01-01'
LastModified: '2025-01-01'
ReviewStatus: unreviewed

Details:
  Website: https://github.com/danielmiessler/fabric
  License: MIT
  Privileges: user
  Free: true
  SupportedOS:
    - Windows
    - Linux
    - macOS
  Capabilities:
    - RemoteAPIProxy

Artifacts:

  Disk:
    - Path: ~/.local/bin/fabric
      Description: Fabric CLI binary (Linux/macOS — go install or pip)
      OS: Linux
      Type: Binary
    - Path: C:\Users\*\go\bin\fabric.exe
      Description: Fabric CLI binary (Windows — go install)
      OS: Windows
      Type: Binary
    - Path: ~/.config/fabric/.env
      Description: >
        Fabric environment file containing API keys for OpenAI, Anthropic, Google,
        and other providers — HIGH VALUE credential target.
      OS: Any
      Type: Config
    - Path: ~/.config/fabric/patterns/
      Description: Pattern library — LLM prompt templates, downloaded from GitHub
      OS: Any
      Type: Config
    - Path: ~/.config/fabric/fabric.db
      Description: Fabric SQLite database storing sessions and history
      OS: Any
      Type: Log

  ModelStorage: []

  Process:
    - Name: fabric
      Description: Fabric CLI process — typically short-lived, invoked in shell pipelines
      CLI:
        - Pattern: 'fabric\s+--pattern\s+\S+'
          Description: Standard fabric pattern invocation
        - Pattern: 'fabric\s+--setup'
          Description: Fabric setup — configures API keys
        - Pattern: 'fabric\s+--update'
          Description: Pattern library update from GitHub
        - Pattern: 'fabric\s+--stream'
          Description: Streaming output mode — often used in automated pipelines
      ParentProcess: bash

  Network:
    - Description: OpenAI API (default provider)
      Protocol: TCP
      Ports:
        - 443
      BindAddress: ''
      Domains:
        - api.openai.com
    - Description: Anthropic API
      Protocol: TCP
      Ports:
        - 443
      BindAddress: ''
      Domains:
        - api.anthropic.com
    - Description: Pattern library downloads from GitHub
      Protocol: TCP
      Ports:
        - 443
      BindAddress: ''
      Domains:
        - raw.githubusercontent.com
        - github.com

  Persistence:
    - OS: Linux
      Type: Cron
      Path: /etc/cron.d/fabric
      Description: Cron job invoking fabric for scheduled automated text processing

  EventLog:
    - EventID: 4688
      ProviderName: Microsoft-Security-Auditing
      LogFile: Security.evtx
      Description: Process creation for fabric.exe

  Registry: []

Detections:
  Sigma:
    - Path: detections/sigma/fabric_process.yml
      Description: Detects fabric process creation with --pattern flag
    - Path: detections/sigma/fabric_credentials_file.yml
      Description: Detects access to ~/.config/fabric/.env (API key credential file)

References:
  - https://github.com/danielmiessler/fabric

Acknowledgements:
  - Person: lolllm contributors
    Handle: ''
