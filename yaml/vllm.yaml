Name: vLLM
Category: InferenceEngine
Description: |
  vLLM is a high-throughput Python inference server optimised for production GPU
  workloads. It exposes an OpenAI-compatible REST API and is commonly deployed
  via pip or Docker on corporate ML servers. Its presence on a workstation (rather
  than a GPU server) is anomalous. vLLM downloads models from Hugging Face Hub
  on first run and stores them in the standard Hugging Face cache. Detection
  pivots on the Python process signature, the Hugging Face cache path, and
  network connections to huggingface.co.
Author: '@lolllm-project'
Created: '2025-01-01'
LastModified: '2025-01-01'
ReviewStatus: unreviewed

Details:
  Website: https://docs.vllm.ai
  License: Apache-2.0
  Privileges: user
  Free: true
  SupportedOS:
    - Linux
    - Windows
  Capabilities:
    - LocalInference
    - APIServer
    - ModelDownload
    - GPUAcceleration

Artifacts:

  Disk:
    - Path: ~/.local/lib/python*/site-packages/vllm/
      Description: vLLM Python package installation directory
      OS: Linux
      Type: Cache
    - Path: ~/.cache/huggingface/hub/
      Description: Hugging Face model cache — contains model shards downloaded by vLLM
      OS: Linux
      Type: Cache
    - Path: C:\Users\*\.cache\huggingface\hub\
      Description: Hugging Face model cache (Windows)
      OS: Windows
      Type: Cache

  ModelStorage:
    - Path: ~/.cache/huggingface/hub/**/*.safetensors
      Description: safetensors model shards downloaded from Hugging Face
      OS: Linux
      MagicBytes:
        - Format: safetensors
          Hex: '7B 22 5F 5F 6D 65 74 61 64 61 74 61 5F 5F 22'
          Offset: 0

  Process:
    - Name: python
      Description: Python process running vLLM entrypoint as an API server
      CLI:
        - Pattern: 'python.*-m\s+vllm\.entrypoints\.openai\.api_server'
          Description: vLLM OpenAI-compatible API server
        - Pattern: 'python.*-m\s+vllm\.entrypoints\.api_server'
          Description: vLLM native API server (older versions)
        - Pattern: 'python.*vllm.*--model\s+\S+'
          Description: vLLM server loading a specific model
      ParentProcess: bash

  Network:
    - Description: OpenAI-compatible REST API
      Protocol: TCP
      Ports:
        - 8000
      BindAddress: '0.0.0.0'
      Domains: []
    - Description: Hugging Face model downloads
      Protocol: TCP
      Ports:
        - 443
      BindAddress: ''
      Domains:
        - huggingface.co
        - cdn-lfs.huggingface.co

  Persistence:
    - OS: Linux
      Type: Service
      Path: /etc/systemd/system/vllm.service
      Description: Systemd unit to run vLLM as a persistent background service

  EventLog:
    - EventID: 4688
      ProviderName: Microsoft-Security-Auditing
      LogFile: Security.evtx
      Description: Process creation for python.exe with vllm entrypoint arguments

  Registry: []

Detections:
  Sigma:
    - Path: detections/sigma/vllm_process.yml
      Description: Detects Python process running the vLLM API server entrypoint
    - Path: detections/sigma/vllm_hf_download.yml
      Description: Detects connections to Hugging Face during vLLM model download

References:
  - https://docs.vllm.ai
  - https://github.com/vllm-project/vllm

Acknowledgements:
  - Person: lolllm contributors
    Handle: ''
